<!DOCTYPE html>
<head>
  <title>Todo App</title>
  <link
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    rel="stylesheet"
  >
  <link
    rel="stylesheet" href="style.css"
    media="screen" charset="utf-8"
  >
</head>
<body class="body">
  <div class="header">
    <img src="./eisenhower-matrix.jpg">
    <a
      class="header__link"
      href="https://goal-life.com/page/method/matrix-eisenhower"
    >
      Want more details?
    </a>
  </div>
  <div class="main">
    <p id="add-element">
      <label for="new-task" class="label">Add Item</label>
      <div class="main__wrapper">
        <input
          id="new-task"
          class="input grow"
          type="text"
        >
        <button class="button">Add</button>
      </div>
    </p>
    <h3 class="main__title">Todo</h3>
    <ul id="incomplete-tasks" class="list">
      <li class="list__item">
        <input type="checkbox" class="input">
        <label class="grow label">Pay Bills</label>
        <input type="text" class="input grow">
        <button class="button button--edit">Edit</button>
        <button class="button button--delete">
          <img src="./remove.svg">
        </button>
      </li>
      <li class="list__item list__item--edit-mode">
        <input type="checkbox" class="input">
        <label class="grow label">Go Shopping</label>
        <input
          type="text"
          value="Go Shopping"
          class="input grow"
        >
        <button class="button button--edit">Save</button>
        <button class="button button--delete">
          <img src="./remove.svg">
        </button>
      </li>
    </ul>
    <h3 class="main__title">Completed</h3>
    <ul id="completed-tasks" class="list">
      <li class="list__item">
        <input type="checkbox" checked class="input">
        <label class="grow label">See the Doctor</label>
        <input type="text" class="input grow">
        <button class="button button--edit">Edit</button>
        <button class="button button--delete">
          <img class="button--delete__img" src="./remove.svg">
        </button>
      </li>
    </ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
